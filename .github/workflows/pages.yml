name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      # The playground consumes the package via a file: dependency, so the
      # package's dist/ has to exist before the playground can build.
      - run: npm ci
      - run: npm run build
      - name: Build the playground for the /console-ui/ base path
        run: |
          cd playground
          npm ci
          npx vite build --base=/console-ui/
          # Pages has no server-side routing; serving index.html as the 404
          # page lets deep links like /console-ui/form resolve.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
